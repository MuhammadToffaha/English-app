plugins {
    id 'com.android.application'
}

def vCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()

android {
    namespace 'com.toffaha.kalimat'
    compileSdk 34

    defaultConfig {
        applicationId 'com.toffaha.kalimat'
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName "1.0.${vCode}"
    }

    signingConfigs {
        release {
            // Fixed family key: every build is signed the same, so new APKs install over the old one.
            storeFile file('kalimat.jks')
            storePassword 'kalimat-family'
            keyAlias 'kalimat'
            keyPassword 'kalimat-family'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
